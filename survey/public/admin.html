<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTS Survey — Admin Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 24px 16px; }
  .shell { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; color: #f1f5f9; }
  .sub { font-size: 13px; color: #64748b; margin-bottom: 28px; }
  /* card */
  .card { background: #1e293b; border-radius: 14px; padding: 24px; margin-bottom: 20px; }
  h2 { font-size: 15px; font-weight: 700; color: #94a3b8;
       text-transform: uppercase; letter-spacing: .06em; margin-bottom: 16px; }
  /* table */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; padding: 8px 12px; color: #64748b; font-weight: 600;
       font-size: 12px; border-bottom: 1px solid #334155; }
  td { padding: 10px 12px; border-bottom: 1px solid #1e293b; color: #cbd5e1; }
  tr:last-child td { border-bottom: none; }
  .best { color: #34d399; font-weight: 700; }
  /* bar chart */
  .bar-wrap { margin-top: 4px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .bar-label { width: 100px; font-size: 13px; color: #94a3b8; flex-shrink: 0; }
  .bar-bg { flex: 1; background: #0f172a; border-radius: 99px; height: 22px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; display: flex; align-items: center;
              padding-left: 10px; font-size: 12px; font-weight: 700; color: #fff;
              transition: width 0.8s ease; }
  .bar-gpt  { background: linear-gradient(90deg, #4f46e5, #7c3aed); }
  .bar-cosy { background: linear-gradient(90deg, #0891b2, #06b6d4); }
  .bar-f5   { background: linear-gradient(90deg, #d97706, #f59e0b); }
  .bar-edge { background: linear-gradient(90deg, #475569, #64748b); }
  /* rater table */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px;
           font-size: 11px; font-weight: 600; }
  .badge-native { background: #064e3b; color: #34d399; }
  .badge-n1     { background: #1e3a5f; color: #60a5fa; }
  .badge-n2     { background: #312e81; color: #a5b4fc; }
  .badge-other  { background: #374151; color: #9ca3af; }
  /* icc */
  .icc-val { font-size: 32px; font-weight: 800; color: #34d399; margin-bottom: 4px; }
  .icc-sub { font-size: 13px; color: #64748b; }
  .icc-interp { margin-top: 8px; font-size: 13px;
                padding: 8px 12px; border-radius: 8px; background: #0f172a; }
  /* login */
  #login-wrap { max-width: 400px; margin: 80px auto; text-align: center; }
  #login-wrap input { width: 100%; padding: 12px; border-radius: 10px;
                      border: 1.5px solid #334155; background: #1e293b;
                      color: #e2e8f0; font-size: 15px; margin: 12px 0; outline: none; }
  #login-wrap button { width: 100%; padding: 12px; border-radius: 10px; border: none;
                       background: linear-gradient(135deg, #4f46e5, #7c3aed);
                       color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
  /* spinner */
  .spin { display: inline-block; width: 18px; height: 18px; border: 3px solid #334155;
          border-top-color: #4f46e5; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* sim pct bar */
  .sim-bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .sim-seg { transition: width .6s ease; }
  .dl-btn { display: inline-block; padding: 8px 18px; border-radius: 8px;
            background: #334155; color: #94a3b8; font-size: 13px; font-weight: 600;
            text-decoration: none; cursor: pointer; border: none; }
  .dl-btn:hover { background: #475569; color: #e2e8f0; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .stat-box { background: #0f172a; border-radius: 10px; padding: 14px 16px; }
  .stat-num { font-size: 26px; font-weight: 800; color: #f1f5f9; }
  .stat-lbl { font-size: 12px; color: #64748b; margin-top: 2px; }
</style>
</head>
<body>
<div id="login-wrap">
  <div style="font-size:28px;margin-bottom:12px">🎧</div>
  <h1 style="color:#f1f5f9;margin-bottom:4px">TTS Survey Admin</h1>
  <p style="color:#64748b;font-size:14px;margin-bottom:16px">输入 ADMIN_KEY 查看结果</p>
  <input type="password" id="key-input" placeholder="Admin key" onkeydown="if(event.key==='Enter')load()">
  <button onclick="load()">查看结果 →</button>
  <p id="login-err" style="color:#f87171;font-size:13px;margin-top:8px;display:none">密钥错误</p>
</div>

<div id="dashboard" style="display:none">
  <div class="shell">
    <h1>🎧 TTS Listening Study — Results</h1>
    <div class="sub" id="sub-line"></div>

    <!-- Summary stats -->
    <div class="card">
      <h2>概览 Overview</h2>
      <div class="stat-grid" id="overview-grid"></div>
    </div>

    <!-- MOS bar chart -->
    <div class="card">
      <h2>自然さ MOS（1–5）</h2>
      <div class="bar-wrap" id="mos-bars"></div>
    </div>

    <!-- Comparison table -->
    <div class="card">
      <h2>システム比較 System Comparison</h2>
      <table id="cmp-table">
        <thead>
          <tr>
            <th>System</th>
            <th>MOS ↑</th>
            <th>SD</th>
            <th>n</th>
            <th>Sim votes ↑</th>
          </tr>
        </thead>
        <tbody id="cmp-body"></tbody>
      </table>
      <p style="font-size:11px;color:#475569;margin-top:10px">
        * EdgeTTS は固定音声のため話者類似度の投票は参考値
      </p>
    </div>

    <!-- ICC -->
    <div class="card" style="display:flex;gap:32px;align-items:flex-start;flex-wrap:wrap">
      <div>
        <h2>評価者間信頼性 Inter-rater reliability</h2>
        <div class="icc-val" id="icc-val">—</div>
        <div class="icc-sub">ICC(2,1) — naturalness ratings</div>
        <div class="icc-interp" id="icc-interp"></div>
      </div>
    </div>

    <!-- Raters -->
    <div class="card">
      <h2>参加者 Raters</h2>
      <table>
        <thead><tr><th>#</th><th>Name/ID</th><th>JP Level</th><th>Submitted</th></tr></thead>
        <tbody id="rater-body"></tbody>
      </table>
    </div>

    <!-- Download -->
    <div style="margin-bottom:40px">
      <button class="dl-btn" id="dl-btn">⬇ Download CSV</button>
    </div>
  </div>
</div>

<script>
const COLORS = {
  'GPT-SoVITS': 'bar-gpt',
  'CosyVoice2': 'bar-cosy',
  'F5-TTS':     'bar-f5',
  'EdgeTTS':    'bar-edge',
};
const SIM_COLORS = ['#4f46e5','#0891b2','#d97706','#475569'];
let adminKey = '';

function load() {
  adminKey = document.getElementById('key-input').value.trim();
  if (!adminKey) return;
  document.getElementById('login-err').style.display = 'none';
  fetchData();
}

async function fetchData() {
  const res = await fetch(`/api/analysis?key=${encodeURIComponent(adminKey)}`);
  if (res.status === 401) {
    document.getElementById('login-err').style.display = 'block';
    return;
  }
  const data = await res.json();
  render(data);
  document.getElementById('login-wrap').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';

  document.getElementById('dl-btn').onclick = () => {
    window.location.href = `/api/results?key=${encodeURIComponent(adminKey)}`;
  };
}

function render({ stats, icc, raters, n_responses }) {
  const SYSTEMS = ['GPT-SoVITS', 'CosyVoice2', 'F5-TTS', 'EdgeTTS'];

  // Sub line
  document.getElementById('sub-line').textContent =
    `${n_responses} 件の回答 · ${raters.length} 名の評価者 · 最終更新: ${new Date().toLocaleString('ja-JP')}`;

  // Overview grid
  const bestMOS  = SYSTEMS.reduce((b, s) => (!stats[b]?.mean || (stats[s]?.mean > stats[b]?.mean)) ? s : b);
  const bestSim  = SYSTEMS.reduce((b, s) => (stats[s]?.sim > stats[b]?.sim) ? s : b);
  document.getElementById('overview-grid').innerHTML = `
    <div class="stat-box"><div class="stat-num">${n_responses}</div><div class="stat-lbl">提出回答数</div></div>
    <div class="stat-box"><div class="stat-num">${raters.length}</div><div class="stat-lbl">評価者数</div></div>
    <div class="stat-box"><div class="stat-num" style="color:#34d399">${stats[bestMOS]?.mean ?? '—'}</div><div class="stat-lbl">最高 MOS (${bestMOS})</div></div>
    <div class="stat-box"><div class="stat-num" style="color:#60a5fa">${icc ?? '—'}</div><div class="stat-lbl">ICC(2,1)</div></div>
  `;

  // MOS bars
  const maxMOS = Math.max(...SYSTEMS.map(s => stats[s]?.mean || 0));
  document.getElementById('mos-bars').innerHTML = SYSTEMS.map(s => {
    const m = stats[s]?.mean;
    const pct = m ? (m / 5 * 100).toFixed(1) : 0;
    const isBest = s === bestMOS;
    return `<div class="bar-row">
      <div class="bar-label">${s}</div>
      <div class="bar-bg">
        <div class="bar-fill ${COLORS[s]}" style="width:${pct}%">
          ${m ? `${m.toFixed(2)}` : '—'}
        </div>
      </div>
      <span style="font-size:12px;color:#64748b;width:40px">±${stats[s]?.sd ?? '—'}</span>
      ${isBest ? '<span style="font-size:14px">🏆</span>' : ''}
    </div>`;
  }).join('');

  // Comparison table
  const totalSim = SYSTEMS.reduce((s, k) => s + (stats[k]?.sim || 0), 0);
  document.getElementById('cmp-body').innerHTML = SYSTEMS
    .slice().sort((a,b) => (stats[b]?.mean || 0) - (stats[a]?.mean || 0))
    .map((s, i) => {
      const st = stats[s] || {};
      const isBest = i === 0;
      const simPct = totalSim ? ((st.sim || 0) / totalSim * 100).toFixed(0) : 0;
      return `<tr>
        <td style="font-weight:600;color:${isBest?'#34d399':'#cbd5e1'}">${s}${isBest?' 🏆':''}</td>
        <td class="${isBest?'best':''}">${st.mean ?? '—'}</td>
        <td style="color:#64748b">${st.sd ?? '—'}</td>
        <td style="color:#64748b">${st.n ?? 0}</td>
        <td>${st.sim ?? 0} <span style="color:#64748b;font-size:12px">(${simPct}%)</span></td>
      </tr>`;
    }).join('');

  // ICC
  if (icc !== null) {
    document.getElementById('icc-val').textContent = icc.toFixed(3);
    let interp = '', color = '';
    if      (icc >= 0.75) { interp = '良好 / Good agreement (≥0.75)';  color = '#34d399'; }
    else if (icc >= 0.5)  { interp = '中程度 / Moderate agreement (≥0.5)'; color = '#f59e0b'; }
    else                  { interp = '低 / Poor agreement (<0.5)';      color = '#f87171'; }
    document.getElementById('icc-val').style.color = color;
    document.getElementById('icc-interp').innerHTML =
      `<span style="color:${color}">${interp}</span>`;
  } else {
    document.getElementById('icc-val').textContent = '—';
    document.getElementById('icc-interp').textContent = '2人以上の回答が必要 / Need ≥2 raters';
  }

  // Raters table
  const badgeClass = { native:'badge-native', n1:'badge-n1', n2:'badge-n2', other:'badge-other' };
  document.getElementById('rater-body').innerHTML = raters.map((r, i) =>
    `<tr>
      <td style="color:#64748b">${i+1}</td>
      <td style="font-weight:600">${r.name || '(匿名)'}</td>
      <td><span class="badge ${badgeClass[r.jp_level]||'badge-other'}">${r.jp_level||'—'}</span></td>
      <td style="color:#64748b;font-size:12px">${r.submitted_at||'—'}</td>
    </tr>`
  ).join('');

  // Auto-refresh every 30s
  setTimeout(fetchData, 30000);
}
</script>
</body>
</html>
